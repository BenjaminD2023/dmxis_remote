<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMXIS</title>
    <link rel="icon" href="../icons/dmxisicon.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #fff;
            overflow-x: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 1vw;
            box-sizing: border-box;
            position: relative;
        }

        .title {
            font-size: clamp(1rem, 2.5vw, 2rem);
            text-align: center;
            flex-grow: 1;
        }

        .hamburger {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 0.5vw;
            z-index: 1000;
        }

        .sync-status {
            color: #aaa;
            font-size: 0.8rem;
            max-width: 14rem;
            text-align: right;
        }

        .menu {
        position: fixed;
        top: 0;
        left: -100%;
        width: 200px;
        height: 100%;
        background: #222222cc;
        padding: 2vw;
        padding-top: 3.5rem;
        transition: left 0.3s ease-in-out;
        z-index: 999;
        display: flex;
        flex-direction: column;
        }

        .menu.open {
            left: 0;
        }

        .menu button {
            display: block;
            width: 100%;
            padding: 0.5vw; /* Reduced padding to make buttons less tall */
            margin: 0.5vw 0;
            background: #555;
            border: none;
            color: #fff;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            cursor: pointer;
            text-align: left;
        }

        .menu button:hover {
            background: #666;
        }

        .menu .section-title {
            font-size: clamp(0.8rem, 1.2vw, 1rem);
            color: #aaa;
            margin: 1vw 0 0.5vw;
            padding-left: 0.5vw;
        }

        .menu .midi-section {
            margin-top: 1vw;
            border-top: 1px solid #555;

        }


        .menu-footer {
        position: relative;
        bottom: -20vw; /* Adjust as needed */
        left: 0;
        right: 0;
        font-size: clamp(0.6rem, 0.8vw, 0.8rem);
        color: #ffffff56;
        text-align: center;
        padding-top: 2vw;
        }
        .split-container {
            display: flex;
            flex: 1;
            width: 100%;
            overflow: hidden;
        }

        .left-container {
            width: 50%;
            padding: 1vw;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .fixture-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 0.5vw;
            margin-bottom: 1vw;
            justify-content: space-between;
        }

        .fixture-type-buttons {
            display: flex;
            gap: 0.5vw;
            flex-wrap: wrap;
        }

        .fixture-type-button {
            width: clamp(60px, 8vw, 80px);
            height: clamp(60px, 8vw, 80px);
            padding: 0.5vw;
            background: #555;
            border: none;
            color: #fff;
            font-size: clamp(0.7rem, 0.8vw, 0.9rem);
            cursor: pointer;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .fixture-type-button:hover {
            background: #666;
        }

        .sort-toggle-button {
            width: clamp(70px, 8vw, 120px);
            height: clamp(15px, 2vw, 20px);
            padding: 0.5vw;
            background: #555;
            border: none;
            color: #fff;
            font-size: clamp(0.7rem, 0.8vw, 0.9rem);
            cursor: pointer;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sort-toggle-button:hover {
            background: #666;
        }

        .channel-controls {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-top: 0.6rem;
        }

        .oscillation-controls {
            flex: 1;
            min-width: 0;
        }

        .oscillation-controls button {
            background: #555;
            border: 1px solid #777;
            border-radius: 5px;
            color: #fff;
            padding: 0.4rem 0.65rem;
            font: inherit;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .oscillation-controls button:hover:not(:disabled) {
            background: #666;
        }

        .oscillation-fields { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.4rem; }
        .oscillation-fields label { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; color: #ccc; font-size: 0.75rem; }
        .oscillation-fields select,
        .oscillation-fields input {
            box-sizing: border-box;
            min-height: 2rem;
            padding: 0.35rem;
            border: 1px solid #777;
            border-radius: 4px;
            background: #333;
            color: #fff;
            font: inherit;
            font-size: 0.75rem;
        }
        .oscillation-fields input { width: 4.5rem; font-variant-numeric: tabular-nums; }
        .oscillation-actions { display: flex; gap: 0.4rem; }
        .oscillation-controls button:disabled { opacity: 0.5; cursor: default; }
        .oscillation-controls :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .oscillation-controls p { margin: 0.35rem 0 0; color: #ccc; font-size: 0.75rem; line-height: 1.4; }
        .oscillation-controls .oscillation-status:empty { display: none; }
        .oscillation-selection { font-variant-numeric: tabular-nums; }
        @media (max-width: 480px) {
            .channel-controls { flex-wrap: wrap; }
            .oscillation-controls { flex-basis: 100%; }
        }

        .fixture-label-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5vw;
        }

        .fixture-label-grid.type-mode {
            grid-template-columns: repeat(6, 1fr);
        }

        .fixture-label {
            padding: 0.5vw;
            background: #33333347;
            border: 1.5px solid #5050509a;
            border-radius: 5px;
            font-size: clamp(0.7rem, 0.8vw, 0.9rem);
            color: #ddd;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            text-align: center;
        }

        .fixture-label:hover {
            background: #555;
        }

        .fixture-label.active {
            background: #a5a5a560;
            color: #fff;
        }

        .fixture-label.group-highlighted {
            background: #a5a5a560;
            border: 1.5px solid #fff;
            color: #fff;
        }

        .fixture-label.empty {
            background: transparent;
            border: none;
            cursor: default;
            visibility: hidden;
            pointer-events: none;
        }

        .right-container {
            width: 50%;
            padding: 1vw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: hidden;
        }

        .page-selector {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 0.3vw;
            margin-bottom: 0.5vw;
            width: 100%;
        }

        .page-row {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 0.3vw;
        }

        .page-button {
            padding: 0.4vw 0.6vw;
            background: #333;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: clamp(0.6rem, 0.8vw, 0.9rem);
        }

        .page-button div {
            white-space: nowrap;
        }

        .page-button .range {
            font-size: clamp(0.5rem, 0.6vw, 0.7rem);
            margin-top: 0.3vw;
            color: #999;
        }

        .page-button.active {
            background: #666;
        }

        .page-button:disabled {
            background: #222;
            cursor: default;
        }

        .fader-grid {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            width: 100%;
            flex-grow: 1;
            position: relative;
        }

        .fader-row {
            display: grid;
            grid-template-columns: repeat(16, minmax(0, 1fr));
            gap: 0.5vw;
            padding-top: 2.2rem;
        }

        .fixture-group {
            position: absolute;
            border: 1.5px solid #5555559a;
            border-radius: 5px;
            margin-top: 33px;
            z-index: 10;
            display: block;
            visibility: visible;
            opacity: 1;
        }

        .fixture-group.active {
            background: #a5a5a560;
            border: 1.5px solid #5555559a;
        }

        .fixture-group.group-highlighted {
            background: #a5a5a560;
            border: 1.5px solid #fff;
        }

        .fixture-title {
            position: absolute;
            top: 0.6rem;
            left: 8px;
            right: 8px;
            font-size: clamp(0.6rem, 0.7vw, 0.8rem);
            color: #ddd;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fixture-group.active .fixture-title,
        .fixture-group.group-highlighted .fixture-title {
            color: #fff;
        }

        .fader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #33333347;
            border: 0.5px solid #afafaf3c;
            padding: clamp(2px, 0.5vw, 5px) clamp(1px, 0.3vw, 3px);
            border-radius: 0.3vw;
            z-index: 2;
            position: relative;
        }

        .fader-container.selected {
            background: #a5a5a560;
            border: 0.5px solid #afafaf9a;
        }

        .fader-container.highlighted {
            background: #a5a5a560;
            border: 0.5px solid #afafaf9a;
        }

        .fader {
            width: clamp(15px, 3vw, 30px);
            height: clamp(100px, 7vw, 90px);
            writing-mode: bt-lr;
            writing-mode: vertical-lr;
            direction: rtl;
            flex-grow: 0.7;
            margin: clamp(2px, 0.5vw, 5px) 0;
        }

        .fader-label {
            font-size: clamp(0.6rem, 0.8vw, 0.9rem);
            text-align: center;
            min-height: 1rem;
            line-height: 1rem;
        }

        .fader-symbol {
            font-size: clamp(0.8rem, 1vw, 1rem);
            text-align: center;
            min-height: 1.2rem;
            line-height: 1.2rem;
            position: absolute;
            bottom: 0.3rem;
            width: 100%;
        }

        .fader-value {
            font-size: clamp(0.6rem, 0.8vw, 0.9rem);
            min-height: 1em;
            width: clamp(15px, 3vw, 30px);
            text-align: center;
            background: transparent;
            border: 0px solid #55555556;
            color: #fff;
            padding-bottom: 0.7vw;
            border-radius: 0.2vw;
            pointer-events: none;
        }

        .fader-value.editable {
            background: #444;
            pointer-events: auto;
        }

        .macro-buttons {
            flex: 0 0 auto;
            padding-top: 1rem;
        }
        .macro-buttons .page-button { width: clamp(60px, 6vw, 85px); min-height: 2rem; }

        .search-modal,
        .color-modal,
        .color-search-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333333;
            padding: 1.5vw;
            border-radius: 0.5vw;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            max-width: clamp(300px, 40vw, 400px);
            width: 100%;
            box-sizing: border-box;
        }

        .search-modal[style*="display: flex"],
        .color-modal[style*="display: flex"],
        .color-search-modal[style*="display: flex"] {
            display: flex;
        }

        .search-container,
        .color-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5vw;
        }

        .search-input,
        .color-input {
            width: 100%;
            padding: 0.5vw;
            background: #444;
            border: 1px solid #5555559a;
            border-radius: 0.3vw;
            color: #fff;
            font-size: clamp(0.8rem, 1vw, 1rem);
            box-sizing: border-box;
        }

        .search-input:focus,
        .color-input:focus {
            outline: none;
            border-color: #a5a5a5;
        }

        .search-results,
        .color-results {
            max-height: clamp(200px, 30vh, 300px);
            overflow-y: auto;
            background: #33333347;
            border: 1px solid #5555559a;
            border-radius: 0.3vw;
            padding: 0.5vw;
        }

        .search-result,
        .color-result {
            display: flex;
            align-items: center;
            padding: 0.5vw;
            font-size: clamp(0.8rem, 1vw, 1rem);
            color: #ddd;
            cursor: pointer;
            border-radius: 0.2vw;
            transition: background 0.2s;
        }

        .search-result:hover:not(.disabled),
        .color-result:hover:not(.disabled) {
            background: #555;
        }

        .search-result.selected,
        .color-result.selected {
            background: #a5a5a560;
            color: #fff;
        }

        .search-result.disabled,
        .color-result.disabled {
            color: #666;
            cursor: default;
        }

        .color-result.disabled {
            color: #aaa;
        }

        .color-availability {
            margin-left: auto;
            padding-left: 0.5rem;
            font-size: 0.8em;
        }

        .color-swatch {
            width: 1.5rem;
            height: 1.5rem;
            margin-right: 0.5vw;
            border: 1px solid #555;
            border-radius: 0.2vw;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="hamburger" onclick="toggleMenu()">☰</button>
        <h1 class="title" id="appTitle">Black Box Lights</h1>
        <span class="sync-status" id="dmxisSyncStatus" role="status" title="Receives current DMXIS levels through the local OSC sync server.">DMXIS sync: connecting…</span>
    </div>
    <div class="menu" id="menu">
        <div class="mode-section">
            <div class="section-title">Modes</div>
            <button onclick="changeMode('Black Box')">Black Box</button>
            <button onclick="changeMode('Auditorium')">Auditorium</button>
            <button onclick="changeMode('Mobile')">Mobile</button>
        </div>
        <div class="midi-section">
            <div class="section-title">MIDI Output</div>
            <button onclick="selectMIDIOutput('Network Session 1')">Mac, Wireless</button>
            <button onclick="selectMIDIOutput('IAC Driver Bus 1')">Mac, Wired</button>
            <button onclick="selectMIDIOutput('loopMIDI Port')">PC, Wired</button>
        </div>
        <div class="menu-footer">Site last updated at 1:03PM, May 09, 2025</div>
    </div>
    <div class="split-container">
        <div class="left-container">
            <div class="fixture-controls">
                <div class="fixture-type-buttons" id="fixtureTypeButtons"></div>
                <button class="sort-toggle-button" id="sortToggle"></button>
            </div>
            <div class="fixture-label-grid" id="fixtureLabelGrid"></div>
        </div>
        <div class="right-container">
            <div class="page-selector" id="pageSelector"></div>
            <div class="fader-grid" id="faderGrid"></div>
            <div class="channel-controls">
                <div class="macro-buttons" id="macroButtons"></div>
                <section class="oscillation-controls" aria-label="Slider oscillations">
                    <div class="oscillation-fields">
                        <label for="oscillationPreset">Oscillation
                            <select id="oscillationPreset">
                                <option value="breathe">Breathe</option>
                                <option value="pulse">Pulse</option>
                                <option value="chase">Chase</option>
                                <option value="shimmer">Shimmer</option>
                                <option value="ledCircle">LED Circle</option>
                                <option value="goboCircle">Gobo Circle</option>
                            </select>
                        </label>
                        <label for="oscillationWaveform">Wave
                            <select id="oscillationWaveform">
                                <option value="sine">Sine</option>
                                <option value="triangle">Triangle</option>
                                <option value="square">Square</option>
                            </select>
                        </label>
                        <label for="oscillationPeriod">Cycle (s)
                            <input id="oscillationPeriod" type="number" min="0.5" max="20" step="0.1" value="4">
                        </label>
                        <label for="oscillationDepth">Depth (%)
                            <input id="oscillationDepth" type="number" min="0" max="100" step="1" value="80">
                        </label>
                        <div class="oscillation-actions">
                            <button id="oscillationStart" type="button" disabled>Start</button>
                            <button id="oscillationStop" type="button" disabled title="Stop and restore starting settings">Stop</button>
                        </div>
                    </div>
                    <p class="oscillation-selection" id="oscillationSelection" aria-live="polite">Select sliders to oscillate.</p>
                    <p id="oscillationRouteHelp">Double-click a slider for its whole category. Cmd/Ctrl-double-click adds another parameter.</p>
                    <p class="oscillation-status" id="oscillationStatus" role="status" aria-live="polite"></p>
                </section>
            </div>
        </div>
    </div>
    <script src="fixtures.js"></script>
    <script src="main.js"></script>
    <script src="hotkeys.js"></script>
    <script src="search.js"></script>
    <script src="colors.js"></script>
    <script src="sorting.js"></script>
    <script src="sync.js"></script>
    <script src="oscillations.js"></script>
</body>
</html>
